name: qotair-ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[dev,typecheck,docs]"
      - run: python -m pytest tests
      - run: python -m ruff check src tests
      - run: python -m mypy
      - run: PYTHONPATH=src python -m mkdocs build --strict
      - run: python -m pip wheel . --no-deps --no-build-isolation -w dist
      - run: python -m venv --without-pip /tmp/qotair-wheel-venv
      - run: /tmp/qotair-wheel-venv/bin/python -m ensurepip --upgrade
      - run: /tmp/qotair-wheel-venv/bin/python -m pip install --no-index --no-deps dist/qotair-*.whl
      - run: /tmp/qotair-wheel-venv/bin/python -c "from importlib.metadata import version; print(version('qotair'))"
