[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qotair"
version = "0.3.0"
description = "Query-driven OpenMC tally acquisition, inference, and refusal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["openmc", "monte-carlo", "uncertainty-quantification", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
tui = ["textual>=0.50"]
openmc = ["openmc>=0.15"]
dev = ["pytest>=7", "ruff>=0.6", "coverage>=7"]
typecheck = ["mypy>=1.11"]
docs = ["mkdocs>=1.6", "mkdocstrings[python]>=0.25"]

[project.scripts]
qotair = "qotair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qotair._single_history" = ["thresholds.json"]
"qotair.inference" = ["profiles.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F"]

[tool.coverage.run]
source = ["qotair"]

[tool.coverage.report]
skip_empty = true

[tool.mypy]
python_version = "3.10"
files = ["src/qotair/api.py"]
mypy_path = "src"
strict = true
ignore_missing_imports = true
follow_imports = "skip"
exclude = "(research_archive|reviewer_bundle)"
